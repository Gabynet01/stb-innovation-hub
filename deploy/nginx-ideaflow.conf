# Nginx configuration for Digital Suggestion Box (Ideaflow) on HTTPS port 443
# Domain: ideaflow.stanbicbank.co.zm
# Place this in /etc/nginx/sites-available/ and symlink to sites-enabled

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ideaflow.stanbicbank.co.zm;
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ideaflow.stanbicbank.co.zm;

    # SSL certificates
    ssl_certificate     /etc/nginx/ssl/ideaflow.stanbicbank.co.zm/ideaflow.stanbicbank.co.zm-chain.pem;
    ssl_certificate_key /etc/nginx/ssl/ideaflow.stanbicbank.co.zm/ideaflow.stanbicbank.co.zm.key;
    ssl_password_file   /etc/nginx/ssl/ideaflow.stanbicbank.co.zm/ssl-passphrase.txt;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Frontend: static files from React build
    root /var/www/ideaflow/frontend;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # API proxy to backend: DSB runs locally on port 9000
    location /v1/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check (if your backend exposes /health at root or under /v1)
    location /health {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA: serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
